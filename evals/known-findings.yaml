# The 16 findings of the manual review of 18-22 November 2026 (the eval's ground truth, design "Success metric").
# Sources: fitbalance-ad-agents/docs/07-security-review.md (7) and fit-balance/docs/security-review.md (8 findings,
# the headers finding counted once per site: fit-balance 5, yahav-picks 4).
#
# files: paths in the project; a path ending in / matches anything inside it.
# keywords: a reported finding must name one of `files` in Where and contain one keyword (case-insensitive).
# before / after: the commit with the problem and the commit with the fix (false alarms are counted on `after`).

# --- fitbalance-ad-agents (Node service), fixed in PR #32 ---
- id: aa-01
  project: fitbalance-ad-agents
  title: no limit on password guesses
  before: 2ff32bc
  after: e83756d
  files: [src/server.mjs]
  owasp: A07
  keywords: [rate limit, brute, guess, lockout, too many, failed attempts, wrong password, unlimited]
  must_pass: true
- id: aa-02
  project: fitbalance-ad-agents
  title: POST accepted from other sites (CSRF)
  before: 2ff32bc
  after: e83756d
  files: [src/server.mjs]
  owasp: A01
  keywords: [csrf, cross-site, origin, content-type, text/plain, another site, other site]
  must_pass: false
- id: aa-03
  project: fitbalance-ad-agents
  title: missing HSTS and Permissions-Policy, partial CSP
  before: 2ff32bc
  after: e83756d
  files: [src/server.mjs]
  owasp: A02
  keywords: [hsts, strict-transport, permissions-policy, object-src, base-uri, form-action]
  must_pass: false
- id: aa-04
  project: fitbalance-ad-agents
  title: yaml 2.6.1 known advisory
  before: 2ff32bc
  after: e83756d
  files: [package.json, package-lock.json]
  owasp: A03
  keywords: [yaml]
  must_pass: false
- id: aa-05
  project: fitbalance-ad-agents
  title: short APP_PASSWORD only warned about
  before: 2ff32bc
  after: e83756d
  files: [src/env.mjs]
  owasp: A07
  keywords: [short, length, 12 characters, minimum, weak password, warning]
  must_pass: false
- id: aa-06
  project: fitbalance-ad-agents
  title: failed logins not logged
  before: 2ff32bc
  after: e83756d
  files: [src/server.mjs, src/log.mjs]
  owasp: A09
  keywords: [not logged, logging, log the, audit trail, A09, no record]
  must_pass: false
- id: aa-07
  project: fitbalance-ad-agents
  title: CI actions pinned to tags
  before: 2ff32bc
  after: e83756d
  files: [.github/workflows/test.yml]
  owasp: A08
  keywords: [pin, sha, tag, "@v4", commit hash]
  must_pass: false

