name: test

on:
  pull_request:
  push:
    branches: [main]

# Read-only: tests never need to write to the repo.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commits, not tags (a tag can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      # Tests only. Evals (evals/) need Claude and a private project and never run here (CONTRIBUTING rule 10).
      - run: python -m pytest -q
